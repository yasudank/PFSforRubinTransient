[project]
name = "rubintransient"
version = "0.1.0"
description = "Search Rubin/LSST transients in Subaru/PFS pfsDesign fields of view via Fink/LSST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.3",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pfs-datamodel",
    "requests>=2.34.2",
]

[project.scripts]
find-transients = "rubin_transient.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rubin_transient"]

[tool.uv.sources]
pfs-datamodel = { git = "https://github.com/Subaru-PFS/datamodel.git", rev = "w.2026.39" }
