# Sample configuration file for Subaru/PFS software versions
# Compatible with yasudank/NetflowByUser config_*.yaml format.
#
# Usage:
#   uv run update-pfs-env config.yaml --dry-run
#   uv run update-pfs-env config.yaml

run: "november2026"

pfs:
  datamodel: ">=w.2026.39"
  pfs_utils: ">=w.2026.39"
  pfs_instdata: ">=1.8.97"
  ics_cobraCharmer: "1.5.12"
  ics_cobraOps: "v2.0.9"
  # Software parameters (for reference)
  black_dot_radius_margin: 1.65
  fiducialsAvoidDistance: 2.9
  brokenCobrasMargin: 0.23
